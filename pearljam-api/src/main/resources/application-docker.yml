application:
  corsOrigins: http://localhost:3000,http://localhost:5173
  roles:
    interviewer: interviewer
    local_user: gestionnaire
    national_user: gestionnaire
    admin: admin
    webclient:
feature:
  stats-scheduling:
    enabled: true
    periodic-cron-refresh: "0 */5 * * * *"
    periodic-cron-days: 2
    historical-cron-refresh: "0 0 1 * * *"
    historical-cron-days: 30
  oidc:
    enabled: true
    auth-server-host: http://localhost:7080
    auth-server-url: ${feature.oidc.auth-server-host}
    client-id: myclient
    realm: sabiane
    principal-attribute: preferred_username
  mail-service:
    enabled: true
    url:
    login:
    password:
    mail-recipients:
    mail-sender:
  swagger:
    enabled: true
  logging:
    file:
      enabled: true
spring:
  docker:
    compose:
      enabled: true
      file: pearljam-api/compose.yml
      lifecycle-management: start-and-stop
      start:
        command: up
      profiles:
        active:
          - all
  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 1
  liquibase:
    contexts: demo
    changeLog: classpath:db/integration-demo.xml
  messages:
    cache-seconds: 1
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent-output: true
