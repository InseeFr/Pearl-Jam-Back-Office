name: Snapshot on feature/hotfix branches

on:
  workflow_dispatch:

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/heads/(feature|hotfix|feat|fix)-.* ]]; then
            echo "This workflow can only be run on 'feature-*' or 'hotfix-*' branches."
            exit 1
          fi

  check-version:
    needs: verify-branch
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(echo ${GITHUB_REF#refs/heads/})-snapshot" >>$GITHUB_OUTPUT

      - name: Print version
        run: echo ${{ steps.version.outputs.version }}

      - uses: mukunku/tag-exists-action@0f5c3d8c7a1b6c9c2d5f7e8a9b0c1d2e3f4a5b6c
        name: Check tag existence
        id: check-tag-exists
        with:
          tag: ${{ steps.version.outputs.version }}

      - name: Create or update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.check-tag-exists.outputs.exists }}" == "true" ]]; then
            echo "Tag ${{ steps.version.outputs.version }} exists, deleting it"
            git push origin :refs/tags/${{ steps.version.outputs.version }}
          fi
          echo "Creating new tag ${{ steps.version.outputs.version }}..."
          git tag ${{ steps.version.outputs.version }} ${{ github.sha }}
          git push origin refs/tags/${{ steps.version.outputs.version }}:refs/tags/${{ steps.version.outputs.version }}

  build-sources:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Set up JDK 25
        uses: actions/setup-java@99b8678c5c2e1e5f0f2e2d8d3a3d79042f2f20c5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build API
        run: mvn package --no-transfer-progress

      - name: Upload API jar
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: app-jar
          path: pearljam-api/target/*.jar

  publish-docker:
    needs: [ check-version, build-sources ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Download uploaded jar
        uses: actions/download-artifact@f44a8c4d8c2e2c2d6d8a6e1c2c3d4f5a6b7c8d9e
        with:
          name: app-jar
          path: pearljam-api/target/

      - name: Publish to Docker Hub
        uses: elgohr/Publish-Docker-Github-Action@3c1f5e1b0e3dcb05463e99e36fcff7bcac28cfb4
        with:
          name: inseefr/pearl-jam-back-office
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          default_branch: ${{ github.ref }}
          tags: ${{ needs.check-version.outputs.release-version }}
          workdir: pearljam-api