name: Build snapshot docker image

on:
  push:
    branches-ignore:
      - main

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >>$GITHUB_OUTPUT
        id: extract_branch

      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          ref: ${{ steps.extract_branch.outputs.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@99b8678c5c2e1e5f0f2e2d8d3a3d79042f2f20c5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build API
        run: mvn package --no-transfer-progress

      - name: Upload API jar
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: app-jar
          path: pearljam-api/target/*.jar

  docker:
    needs:
      - build-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Download uploaded jar
        uses: actions/download-artifact@f44a8c4d8c2e2c2d6d8a6e1c2c3d4f5a6b7c8d9e
        with:
          name: app-jar
          path: pearljam-api/target/

      - name: Create docker version tag
        id: docker-version
        run: |
          # replace '/' by '-' for docker tags
          docker_tag="${{ needs.build-snapshot.outputs.branch }}"
          docker_tag=$(echo "$docker_tag" | sed 's/[\/+]/-/g')
          echo "docker_tag=${docker_tag}" >> $GITHUB_ENV

      - name: Publish to Docker Hub
        uses: elgohr/Publish-Docker-Github-Action@3c1f5e1b0e3dcb05463e99e36fcff7bcac28cfb4
        with:
          name: inseefr/pearl-jam-back-office
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          default_branch: ${{ github.ref }}
          tags: "snapshot-${{ env.docker_tag }}"
          workdir: pearljam-api