name: Build snapshot docker image

on:
  push:
    branches-ignore:
      - main

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >>$GITHUB_OUTPUT
        id: extract_branch

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.extract_branch.outputs.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Build API
        run: mvn package --no-transfer-progress

      - name: Upload API jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-jar
          path: pearljam-api/target/*.jar

  docker:
    needs:
      - build-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download uploaded jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-jar
          path: pearljam-api/target/

      - name: Create docker version tag
        id: docker-version
        run: |
          # replace '/' by '-' for docker tags
          docker_tag="${{ needs.build-snapshot.outputs.branch }}"
          docker_tag=$(echo "$docker_tag" | sed 's/[\/+]/-/g')
          echo "docker_tag=${docker_tag}" >> $GITHUB_ENV

      - name: Publish to Docker Hub
        uses: elgohr/Publish-Docker-Github-Action@32b6623ebb46c5fe6dcfc2281cfcd549a31366ce # v5
        with:
          name: inseefr/pearl-jam-back-office
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          default_branch: ${{ github.ref }}
          tags: "snapshot-${{ env.docker_tag }}"
          workdir: pearljam-api